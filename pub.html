<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Bride Sahara | Luxury Collection</title>

  <link rel="preconnect"
    href="https://fonts.googleapis.com">

  <link rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet"
    href="style.css">

</head>

<body>

  <!-- HERO VIDEO -->

  <section class="pub-hero">

    <!-- VIDEO -->

    <video id="heroVideo"
      class="pub-video"
      autoplay
      muted
      loop
      playsinline>

      <source src="./images/1.mp4"
        type="video/mp4">

    </video>

    <!-- OVERLAY -->

    <div class="pub-overlay"></div>

    <!-- CONTENT -->

    <div class="pub-content">

      <img src="./images/logo.png"
        class="pub-logo">

      <span class="pub-badge">

        ✨ Bride Sahara Luxury Collection

      </span>

      <h1>

        اكتشفي أسرار الجمال الصحراوي الطبيعي

      </h1>

      <p>

        منتجات فاخرة للعناية بالبشرة والجسم بلمسة صحراوية أنثوية راقية.

      </p>

      <!-- BUTTONS -->

      <div class="pub-buttons">

        <a href="https://wa.me/212605945494"
          target="_blank"
          class="pub-btn">

          <i class="fab fa-whatsapp"></i>

          اطلبي الآن

        </a>

        <button id="soundBtn"
          class="sound-btn">

          <i class="fa-solid fa-volume-xmark"></i>

        </button>

      </div>

    </div>

    <!-- SCROLL -->

    <div class="scroll-down">

      <i class="fa-solid fa-angle-down"></i>

    </div>

  </section>

  <script>

    const video = document.getElementById("heroVideo");

    const soundBtn = document.getElementById("soundBtn");

    let isMuted = true;

    soundBtn.addEventListener("click", () => {

      if (isMuted) {

        video.muted = false;

        soundBtn.innerHTML =
          '<i class="fa-solid fa-volume-high"></i>';

        isMuted = false;

      } else {

        video.muted = true;

        soundBtn.innerHTML =
          '<i class="fa-solid fa-volume-xmark"></i>';

        isMuted = true;

      }

    });

  </script>

</body>

</html>
